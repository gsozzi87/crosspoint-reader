name: Product audit
on:
  push:
    branches: [ws397, codex/product-audit-2026-09-12]
  pull_request:
    branches: [ws397]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: audit
          POSTGRES_DB: crosspoint_audit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgres://audit:audit@localhost:5432/crosspoint_audit_test
      PRODUCT_AUDIT_TESTS: "1"
      MONTHLY_LLM_CALLS: "1"
      MONTHLY_STT_SECONDS: "10"
      ADMIN_EMAIL: operator@example.test
      SESSION_SECRET: audit-fixture-secret-never-use-in-production
      DATA_DIR: /tmp/crosspoint-audit-data
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - run: bun test test/product-audit.test.ts
      - name: Validate board JavaScript syntax
        run: node --check public/board/app.js
  firmware:
    runs-on: ubuntu-latest
    env:
      WS397_OTA_URL: https://example.invalid/audit-only
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install build dependencies
        run: |
          python -m pip install https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          python -m pip install "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"
      - name: Build WS397 (validation only; no deployment)
        run: |
          touch platformio.local.ini
          pio run -e ws397
      - name: Run existing host unit tests
        run: |
          cmake -S test -B build/test -DCMAKE_BUILD_TYPE=Release
          cmake --build build/test -j2
          ctest --test-dir build/test --output-on-failure
