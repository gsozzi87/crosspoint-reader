name: CI (build)

on:
  push:
    # `ws397` es la rama por defecto de este fork y la que se publica por OTA:
    # sin ella acá, CI no miraba NADA de lo que se sube al aparato.
    branches: [master, ws397]
  pull_request:

permissions:
  contents: read

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install clang-format-21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get update
          sudo apt-get install -y clang-format-21

      - name: Run clang-format on changed files
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          BASE_SHA="${PR_BASE_SHA:-${PUSH_BEFORE_SHA:-}}"
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          mapfile -d '' FILES < <(
            git diff --name-only -z --diff-filter=ACMR "$BASE_SHA" HEAD -- \
              '*.c' '*.cpp' '*.h' '*.hpp' \
              ':(exclude)lib/EpdFont/builtinFonts/**' \
              ':(exclude)lib/Epub/Epub/hyphenation/generated/**' \
              ':(exclude)lib/uzlib/**' \
              ':(exclude)lib/miniz/third_party/**'
          )
          if (( ${#FILES[@]} )); then
            PATH="/usr/lib/llvm-21/bin:$PATH" clang-format-21 -style=file -i -- "${FILES[@]}"
          fi
          git diff --exit-code || (echo "Run clang-format-21 on the changed C/C++ files" && exit 1)

  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          # platform-espressif32's builder/main.py imports these unconditionally; its own
          # penv bootstrap (builder/penv_setup.py) is supposed to install them automatically
          # but isn't picking them up reliably in this runner image, so pin them explicitly.
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Run cppcheck
        run: pio check --fail-on-defect low --fail-on-defect medium --fail-on-defect high

  build:
    name: Build ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Artifact names match the release asset names OtaUpdater requests:
        # plain firmware.bin for the C3 X4/X3 binary, firmware-<board>.bin for
        # the S3 boards.
        include:
          - env: default
            asset: firmware.bin
          - env: sticky
            asset: firmware-sticky.bin
          - env: x4pro
            asset: firmware-x4pro.bin
          - env: papermono
            asset: firmware-papermono.bin
          # La placa de este fork. Es la única que se prueba en hardware, así que
          # es justo la que no puede quedar sin compilar en CI.
          - env: ws397
            asset: firmware-ws397.bin
          - env: x4c
            asset: firmware-x4c.bin
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          # platform-espressif32's builder/main.py imports these unconditionally; its own
          # penv bootstrap (builder/penv_setup.py) is supposed to install them automatically
          # but isn't picking them up reliably in this runner image, so pin them explicitly.
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Build ${{ matrix.env }} firmware
        run: |
          set -euo pipefail
          pio run -e ${{ matrix.env }} | tee pio.log

      - name: Verify WS397 OTA URL is embedded
        if: matrix.env == 'ws397'
        run: |
          set -euo pipefail
          strings .pio/build/ws397/firmware.bin | grep -Fqx \
            'https://paper-esp32.up.railway.app/firmware/latest'

      - name: Extract firmware stats
        run: |
          set -euo pipefail
          ram_line="$(grep -E "RAM:\\s" -m1 pio.log || true)"
          flash_line="$(grep -E "Flash:\\s" -m1 pio.log || true)"
          echo "ram_line=${ram_line}" >> "$GITHUB_OUTPUT"
          echo "flash_line=${flash_line}" >> "$GITHUB_OUTPUT"
          {
            echo "## ${{ matrix.env }} firmware build stats"
            if [ -n "$ram_line" ]; then echo "- ${ram_line}"; else echo "- RAM: not found"; fi
            if [ -n "$flash_line" ]; then echo "- ${flash_line}"; else echo "- Flash: not found"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: .pio/build/${{ matrix.env }}/firmware.bin
          if-no-files-found: error

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Cache googletest source
        uses: actions/cache@v4
        with:
          path: build/test/_deps/googletest-src
          key: ${{ runner.os }}-googletest-${{ hashFiles('test/CMakeLists.txt') }}

      - name: Configure
        run: cmake -S test -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/test

      - name: Run tests
        run: ctest --test-dir build/test --output-on-failure -j

  # Las pruebas de escritorio de la ws397: lógica pura que corre sin aparato y
  # sin red (el cajón de Lua, la cuenta del diario de batería, el reparto de
  # titulares y quién queda de administrador al registrarse). Existían desde
  # hace versiones y NUNCA las corría nadie más que a mano.
  ws397-tests:
    name: ws397 desktop tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install server deps
        working-directory: server
        run: bun install --frozen-lockfile

      - name: Cajón de Lua
        run: ./test/lua_sandbox/run.sh

      - name: Diario de batería
        run: ./test/battery_drain/run.sh

      - name: Paquete de noticias
        run: ./test/news_pack/run.sh

      - name: Quién queda de administrador
        run: ./test/register_admin/run.sh

      - name: Filtro de URLs (SSRF)
        run: ./test/ssrf/run.sh

      - name: "Libros: lo que dice el bot"
        run: ./test/libros/run.sh

      - name: Geometría de las páginas XTC
        run: ./test/xtc_geometry/run.sh

      - name: Reintentos que no se aplican dos veces
        run: ./test/idempotency/run.sh

      - name: Log del aparato
        run: ./test/device_log/run.sh

      - name: Resolución de nombres fijada
        run: ./test/net_lookup/run.sh

      - name: EPUB armado a mano
        run: ./test/epub/run.sh

  # El servidor: que compile de tipos y que el lockfile esté al día. Con
  # --frozen-lockfile, un package.json tocado sin actualizar el lock falla acá
  # y no en el deploy de Railway.
  server:
    name: Server typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        working-directory: server
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: server
        run: bunx tsc --noEmit

  # This job is used as the PR required actions check, allows for changes to other steps in the future without breaking
  # PR requirements.
  test-status:
    name: Test Status
    needs:
      - build
      - clang-format
      - cppcheck
      - unit-tests
      - ws397-tests
      - server
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail because needed jobs failed
        # Fail if any job failed or was cancelled (skipped jobs are ok)
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - name: Success
        run: exit 0
